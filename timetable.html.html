<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Class Timetable</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .time-slot {
            font-weight: bold;
            background-color: #f8f9fa;
        }
        .subject {
            color: white;
            padding: 15px;
            border-radius: 8px;
        }
        .math { background-color: #007bff; }
        .science { background-color: #28a745; }
        .english { background-color: #dc3545; }
        .lab { background-color: #6f42c1; }
        .break { background-color: #ffc107; color: black; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">Class Timetable</h2>

    <div class="table-responsive">
        <table class="table table-bordered text-center">
            
            <!-- Header Row -->
            <tr>
                <th>Day / Time</th>
                <th>9:00 - 10:00</th>
                <th>10:00 - 11:00</th>
                <th>11:00 - 12:00</th>
                <th>12:00 - 1:00</th>
                <th>1:00 - 2:00</th>
            </tr>

            <!-- Monday -->
            <tr>
                <td class="time-slot">Monday</td>
                <td class="subject math">Math</td>
                <td class="subject science">Science</td>
                <td class="subject english">English</td>
                <td class="subject break">Break</td>
                <td class="subject lab">Lab</td>
            </tr>

            <!-- Tuesday -->
            <tr>
                <td class="time-slot">Tuesday</td>
                <td class="subject science">Science</td>
                <td class="subject math">Math</td>
                <td class="subject lab">Lab</td>
                <td class="subject break">Break</td>
                <td class="subject english">English</td>
            </tr>

            <!-- Wednesday -->
            <tr>
                <td class="time-slot">Wednesday</td>
                <td class="subject english">English</td>
                <td class="subject lab">Lab</td>
                <td class="subject math">Math</td>
                <td class="subject break">Break</td>
                <td class="subject science">Science</td>
            </tr>

            <!-- Thursday -->
            <tr>
                <td class="time-slot">Thursday</td>
                <td class="subject lab">Lab</td>
                <td class="subject english">English</td>
                <td class="subject science">Science</td>
                <td class="subject break">Break</td>
                <td class="subject math">Math</td>
            </tr>

            <!-- Friday -->
            <tr>
                <td class="time-slot">Friday</td>
                <td class="subject math">Math</td>
                <td class="subject english">English</td>
                <td class="subject science">Science</td>
                <td class="subject break">Break</td>
                <td class="subject lab">Lab</td>
            </tr>

        </table>
    </div>
</div>

</body>
</html>
